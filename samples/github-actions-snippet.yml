# Add this step to your GitHub Actions workflow AFTER the test step.
# Requires secrets: FLAKERADAR_URL (e.g. https://flakeradar.example.com)
#                   FLAKERADAR_TOKEN (your FLAKERADAR_API_TOKEN)
# Works with any runner that produces a JUnit XML report, e.g.:
#   pytest --junitxml=junit.xml         (Python)
#   vitest --reporter=junit             (JS/TS)
#   go test ... | go-junit-report       (Go)

- name: Report test results to FlakeRadar
  if: always()   # crucial — you want the FAILED runs recorded too
  run: |
    curl --fail-with-body -sS -X POST \
      "${{ secrets.FLAKERADAR_URL }}/api/ingest?commit_sha=${{ github.sha }}&branch=${{ github.ref_name }}&ci_run_id=${{ github.run_id }}-${{ github.run_attempt }}" \
      -H "X-API-Key: ${{ secrets.FLAKERADAR_TOKEN }}" \
      -H "Content-Type: application/xml" \
      --data-binary @junit.xml
