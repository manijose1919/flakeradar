services:
  flakeradar:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      # In-container CORS is irrelevant (same origin); kept for clarity.
      FLAKERADAR_DATABASE_URL: sqlite:////srv/backend/data/flakeradar.db
    volumes:
      - flakeradar-data:/srv/backend/data
    restart: unless-stopped

volumes:
  flakeradar-data:
